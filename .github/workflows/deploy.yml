name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/github-chatbot-tool-d8qrup]
  workflow_dispatch:

# Statik cikti gh-pages branch'ine yaziliyor; Pages bu branch'ten servis ediyor.
# actions/configure-pages ile otomatik acma denendi ama GITHUB_TOKEN'in
# "create pages site" yetkisi yok ("Resource not accessible by integration"),
# bu yuzden branch yontemi kullaniliyor: contents:write yetkisi yeterli.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Proje sitesi <kullanici>.github.io/<depo>/ altinda yayinlanir.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Jekyll islemesini kapat
        # Alt cizgiyle baslayan Next.js klasorleri (_next) aksi halde Pages
        # tarafindan yok sayilir.
        run: touch out/.nojekyll

      - name: gh-pages branch'ine yayinla
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -q -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
